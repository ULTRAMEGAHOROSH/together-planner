<tp-dialog-shell title="Все предстоящие">
  @if (events().length > 0) {
    <tp-upcoming-rows
      [events]="events()"
      [members]="members()"
      [today]="today()"
      (open)="pick($event)"
    />
  }
  @if (errorText(); as text) {
    <tp-error-state [text]="text" (retry)="loadMore()" />
  } @else if (loading()) {
    <div class="skeleton" role="status" aria-label="Загружаем события…"></div>
  } @else if (events().length === 0) {
    <tp-empty-state text="Пока ничего не запланировано." />
  } @else if (hasNext()) {
    <button tpButton variant="ghost" type="button" class="more" (click)="loadMore()">
      Показать ещё
    </button>
  }
</tp-dialog-shell>
