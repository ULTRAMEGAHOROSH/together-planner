<article>
  <div>
    <h2 class="name">{{ template().name }}</h2>
    @if (template().description) {
      <p class="description">{{ template().description }}</p>
    }
  </div>
  <ul class="chips" aria-label="Что в шаблоне">
    @for (chip of chips(); track chip.text) {
      <li [style.color]="chip.color" [style.background]="chip.background">{{ chip.text }}</li>
    }
  </ul>
  <span class="applied">{{ appliedText() }}</span>
  <div class="actions">
    <button tpButton size="sm" type="button" (click)="apply.emit()">Применить</button>
    <button tpButton variant="ghost" size="sm" type="button" (click)="open.emit()">Открыть</button>
    <span class="spacer"></span>
    <button
      tpButton
      [variant]="confirming() ? 'danger' : 'ghost'"
      size="sm"
      type="button"
      [loading]="deleting()"
      (click)="askOrRemove()"
      (blur)="confirming.set(false)"
    >
      {{ confirming() ? 'Точно удалить?' : 'Удалить' }}
    </button>
  </div>
</article>
