@for (option of options(); track option.value; let i = $index) {
  <button
    #chip
    type="button"
    role="radio"
    class="chip"
    [attr.aria-checked]="i === selected()"
    [tabIndex]="i === focusable() ? 0 : -1"
    [style.--tp-chip-bg]="option.bg ?? null"
    [style.--tp-chip-fg]="option.fg ?? null"
    (click)="choose(i)"
  >
    @if (option.dot; as dot) {
      <span class="dot" aria-hidden="true" [style.background]="dot"></span>
    }
    {{ option.label }}
  </button>
}
