<tp-dialog-shell [title]="data.title">
  <p class="text">{{ data.text }}</p>
  <button
    tpButton
    tpDialogFooter
    variant="ghost"
    type="button"
    cdkFocusInitial
    (click)="ref.close()"
  >
    {{ data.cancelLabel ?? 'Отмена' }}
  </button>
  <button tpButton tpDialogFooter variant="danger" type="button" (click)="ref.close(true)">
    {{ data.confirmLabel }}
  </button>
</tp-dialog-shell>
