<tp-dialog-shell [title]="data.title">
  <p class="text">{{ data.text }}</p>
  <button tpDialogFooter type="button" class="cancel" cdkFocusInitial (click)="ref.close()">
    {{ data.cancelLabel ?? 'Отмена' }}
  </button>
  <button tpDialogFooter type="button" class="confirm" (click)="ref.close(true)">
    {{ data.confirmLabel }}
  </button>
</tp-dialog-shell>
