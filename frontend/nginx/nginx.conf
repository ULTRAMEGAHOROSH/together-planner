# Single origin (spec §10.6): "/" → Angular SPA, "/api/" → backend.
# Rate limits for /api/v1/auth/ and /api/v1/workspaces/join are added in QA-05.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Docker's embedded DNS. Resolving at request time (proxy_pass with a variable)
    # lets nginx start even when the backend container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css): cache forever.
    location ~* "^/(main|polyfills|styles|chunk)-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts are not hashed: cache for a month, never fall back to index.html.
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Everything else is the SPA: deep links fall back to index.html, which must not be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
