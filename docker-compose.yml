services:
  postgres:
    image: postgres:18-alpine
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]      # с PG 18 образ хранит данные в /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["app"]
    build: ./backend
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
    # Порт нужен только для разработки (npm start с прокси, Swagger, E2E на :4200).
    # В продакшене убрать: backend доступен только через nginx сервиса frontend.
    ports: ["8080:8080"]

  frontend:
    profiles: ["app"]
    build: ./frontend
    depends_on: [backend]
    # 8081, а не 80: порт 80 на Windows часто занят IIS. http://localhost:8081 — безопасный
    # контекст, поэтому cookie с Secure работает и без HTTPS.
    ports: ["8081:80"]

volumes:
  pgdata:
